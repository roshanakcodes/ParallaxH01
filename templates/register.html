<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicalGuard - Register Patient</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800">
    
    <!-- Clinical Modern Frosted Glass Navigation -->
    <nav class="backdrop-blur-md bg-white/80 sticky top-0 z-50 border-b border-slate-200 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-4">
            <div class="flex items-center gap-3">
                <div class="h-3 w-3 rounded-full bg-emerald-500"></div>
                <span class="font-bold text-slate-900 tracking-tight text-lg">ClinicalGuard <span class="text-sky-600 font-normal">IoT</span></span>
            </div>
            <div class="flex gap-6 items-center text-sm">
                <a href="/" class="text-slate-600 hover:text-slate-900 font-medium transition">Nurse Dashboard</a>
                <a href="/register" class="text-sky-600 font-semibold border-b-2 border-sky-600 pb-1">Register Patient</a>
                <a href="/patients" class="text-slate-600 hover:text-slate-900 font-medium transition">Profiles</a>
                <a href="/nurses" class="text-slate-600 hover:text-slate-900 font-medium transition pl-4 border-l border-slate-300">Admin Staff</a>
            </div>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-6 py-10">
        <div class="bg-white border border-slate-200 shadow-sm rounded-xl p-8">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Create Prescription Profile</h1>
            <p class="text-sm text-slate-500 mb-6">Authorize via staff RFID badge to register a new clinical prescription.</p>

            {% if success %}
            <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-lg text-sm mb-6">{{ success }}</div>
            {% endif %}
            {% if error %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-lg text-sm mb-6">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/register" class="space-y-6">
                <div class="bg-sky-50/50 p-5 rounded-xl border border-sky-100">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-sky-900 mb-2">Nurse Authorization</label>
                    <input type="text" id="nurse_rfid" name="nurse_rfid" placeholder="Scan Nurse RFID Badge..." required class="block w-full p-2.5 bg-white border border-sky-200 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Patient ID</label>
                        <input type="text" name="patient_id" placeholder="e.g., PT-1001" required class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Patient Name</label>
                        <input type="text" name="patient_name" placeholder="Full Name" required class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">RFID Tag UID</label>
                        <input type="text" id="rfid_uid" name="rfid_uid" placeholder="Tag UID" required class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Exp. Weight (g)</label>
                        <input type="number" step="0.01" name="expected_weight_g" required class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Tol. (± g)</label>
                        <input type="number" step="0.01" name="tolerance_g" value="0.2" required class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Exp. Size (mm)</label>
                        <input type="number" step="0.1" name="expected_size_mm" required class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Tol. (± mm)</label>
                        <input type="number" step="0.1" name="size_tolerance_mm" value="2.0" required class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Expected Color</label>
                        <select name="expected_color" class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm bg-white">
                            <option value="white">White</option>
                            <option value="red">Red</option>
                            <option value="blue">Blue</option>
                            <option value="yellow">Yellow</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Expected Shape</label>
                        <select name="expected_shape" class="block w-full p-2.5 border border-slate-200 rounded-lg text-sm bg-white">
                            <option value="round">Round</option>
                            <option value="capsule">Capsule</option>
                            <option value="oval">Oval</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-4 rounded-lg shadow-sm transition text-sm mt-4">
                    Authorize & Save Profile
                </button>
            </form>
        </div>
    </div>
</body>
<script>
  // 1. Cleanly parse path and notify Flask of active page
  const rawPath = window.location.pathname.replace(/^\/|\/$/g, '').trim();
  const currentPath = rawPath === '' ? 'dashboard' : rawPath;

  fetch('/api/active_page', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ page: currentPath })
  });

  // 2. Poll for scanned RFID card data
  if (currentPath !== 'dashboard') {
    setInterval(() => {
      fetch('/api/latest_rfid')
        .then(res => res.json())
        .then(data => {
          if (data.rfid_uid) {
            const scannedUid = data.rfid_uid;

            // Priority 1: Fill currently focused input box if user clicked into one
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.id === 'nurse_rfid' || activeEl.id === 'rfid_uid' || activeEl.name === 'nurse_rfid' || activeEl.name === 'rfid_uid')) {
              activeEl.value = scannedUid;
              activeEl.dispatchEvent(new Event('input'));
              return;
            }

            // Priority 2: Auto-fill first empty RFID input box on the page
            const emptyInput = Array.from(document.querySelectorAll('input[id*="rfid"], input[name*="rfid"]'))
                                    .find(input => input.value.trim() === '');

            if (emptyInput) {
              emptyInput.value = scannedUid;
              emptyInput.dispatchEvent(new Event('input'));
            } else {
              // Priority 3: Fallback to primary rfid_uid input field
              const primaryInput = document.getElementById('rfid_uid') || document.getElementById('nurse_rfid');
              if (primaryInput) {
                primaryInput.value = scannedUid;
                primaryInput.dispatchEvent(new Event('input'));
              }
            }
          }
        })
        .catch(err => console.error("RFID Sync Error:", err));
    }, 800);
  }
</script>
</html>
